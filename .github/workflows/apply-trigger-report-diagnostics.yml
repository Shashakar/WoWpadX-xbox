name: Apply trigger report diagnostics

on:
  push:
    branches:
      - agent/fix-dual-trigger-combo
    paths:
      - .github/workflows/apply-trigger-report-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dual-trigger-combo
          fetch-depth: 0

      - name: Patch RawInputGamepad.cpp
        shell: pwsh
        run: |
          $path = 'WoWpadX/RawInputGamepad.cpp'
          $text = Get-Content $path -Raw

          if ($text.Contains('[RawInputTriggerProbe]')) {
            Write-Host 'Diagnostic patch already present.'
            exit 0
          }

          $parseStart = $text.IndexOf('    void ParseAllyAxes(')
          $parseEnd = $text.IndexOf('    bool LoadDevice(', $parseStart)
          if ($parseStart -lt 0 -or $parseEnd -lt 0) {
            throw 'Could not locate ParseAllyAxes.'
          }

          $parseReplacement = @'
    void ParseAllyAxes(
        const BYTE* report,
        ULONG reportLength,
        ControllerState& state)
    {
        if (reportLength < 11)
            return;

        state.axisKnown[SDL_GAMEPAD_AXIS_LEFTX] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_LEFTY] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTX] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTY] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = true;

        state.axes[SDL_GAMEPAD_AXIS_LEFTX] =
            NormalizeRawStick16(ReadLittleEndian16(report, 1));
        state.axes[SDL_GAMEPAD_AXIS_LEFTY] =
            NormalizeRawStick16(ReadLittleEndian16(report, 3));
        state.axes[SDL_GAMEPAD_AXIS_RIGHTX] =
            NormalizeRawStick16(ReadLittleEndian16(report, 5));
        state.axes[SDL_GAMEPAD_AXIS_RIGHTY] =
            NormalizeRawStick16(ReadLittleEndian16(report, 7));

        // Preserve the last hardware-validated single-trigger behavior.
        // This compatibility axis cannot yet represent both triggers; the
        // diagnostic logger below identifies whether bytes 11-15 contain
        // independent trigger-held bits.
        constexpr int triggerCenter = 128;
        const int combinedTrigger = static_cast<int>(report[10]);
        const int leftMagnitude = combinedTrigger < triggerCenter
            ? triggerCenter - combinedTrigger
            : 0;
        const int rightMagnitude = combinedTrigger > triggerCenter
            ? combinedTrigger - triggerCenter
            : 0;

        state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = static_cast<Sint16>(
            std::min(32767, leftMagnitude * 32767 / triggerCenter));
        state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = static_cast<Sint16>(
            std::min(32767, rightMagnitude * 32767 / 127));
    }

'@

          $text = $text.Substring(0, $parseStart) + $parseReplacement + $text.Substring($parseEnd)

          $processMarker = '    void ProcessRawInput(HRAWINPUT rawInputHandle)'
          $processIndex = $text.IndexOf($processMarker)
          if ($processIndex -lt 0) {
            throw 'Could not locate ProcessRawInput.'
          }

          $logger = @'
    void LogTriggerRelevantReportChanges(const BYTE* report, ULONG reportLength)
    {
        if (reportLength < 11)
            return;

        static std::array<BYTE, 16> previous{};
        static ULONG previousLength = 0;
        static bool initialized = false;

        const ULONG capturedLength = std::min<ULONG>(
            reportLength, static_cast<ULONG>(previous.size()));
        bool changed = !initialized || previousLength != capturedLength;

        if (!changed) {
            // Ignore stick-only traffic. Trigger compatibility state begins at
            // byte 9, and button/hat data follows it.
            for (ULONG index = 9; index < capturedLength; ++index) {
                if (previous[index] != report[index]) {
                    changed = true;
                    break;
                }
            }
        }

        if (!changed)
            return;

        QStringList bytes;
        for (ULONG index = 0; index < capturedLength; ++index) {
            bytes.append(QString("%1")
                .arg(report[index], 2, 16, QLatin1Char('0')));
            previous[index] = report[index];
        }
        previousLength = capturedLength;
        initialized = true;

        Log::writeLine(QString(
            "[RawInputTriggerProbe] bytes=[%1] trigger16=%2 "
            "triggerHi=%3 tail=[%4]")
            .arg(bytes.join(' '))
            .arg(ReadLittleEndian16(report, 9))
            .arg(report[10])
            .arg(bytes.mid(11).join(' ')));
    }

'@

          $text = $text.Insert($processIndex, $logger)

          $needle = '            ControllerState state;'
          $callIndex = $text.IndexOf($needle, $text.IndexOf($processMarker))
          if ($callIndex -lt 0) {
            throw 'Could not locate report parsing loop.'
          }
          $text = $text.Insert($callIndex, "            LogTriggerRelevantReportChanges(report, reportLength);`r`n`r`n")

          Set-Content -Path $path -Value $text -NoNewline

      - name: Commit diagnostic source
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- WoWpadX/RawInputGamepad.cpp)) {
            Write-Host 'No source changes.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WoWpadX/RawInputGamepad.cpp
          git commit -m 'Log trigger and button report transitions'
          git push origin HEAD:agent/fix-dual-trigger-combo
