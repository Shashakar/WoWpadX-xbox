name: Apply Ally trigger reconstruction

on:
  push:
    branches:
      - agent/fix-dual-trigger-combo
    paths:
      - .github/workflows/apply-trigger-reconstruction.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dual-trigger-combo
          fetch-depth: 0

      - name: Patch RawInputGamepad.cpp
        shell: pwsh
        run: |
          $path = 'WoWpadX/RawInputGamepad.cpp'
          $text = Get-Content $path -Raw

          if ($text.Contains('ReconstructAllyTriggers')) {
            Write-Host 'Patch already present.'
            exit 0
          }

          $start = $text.IndexOf('    void ParseAllyAxes(')
          $end = $text.IndexOf('    bool LoadDevice(', $start)
          if ($start -lt 0 -or $end -lt 0) {
            throw 'Could not locate ParseAllyAxes block.'
          }

          $replacement = @'
    uint16_t ReadLittleEndian16(const BYTE* report, size_t offset)
    {
        return static_cast<uint16_t>(report[offset]) |
            (static_cast<uint16_t>(report[offset + 1]) << 8);
    }

    Sint16 NormalizeRawStick16(uint16_t value)
    {
        return static_cast<Sint16>(
            std::clamp(static_cast<int>(value) - 32768, -32768, 32767));
    }

    Sint16 NormalizeRawTrigger(int value)
    {
        constexpr int triggerMaximum = 1023;
        const int clamped = std::clamp(value, 0, triggerMaximum);
        return static_cast<Sint16>(
            static_cast<uint32_t>(clamped) * 32767u / triggerMaximum);
    }

    void ReconstructAllyTriggers(
        uint16_t centeredZ,
        uint16_t rightTriggerRaw,
        Sint16& leftTrigger,
        Sint16& rightTrigger)
    {
        // Windows exposes Z as a centered difference axis (RT - LT) and
        // Rz as the independent right-trigger magnitude. Recover LT exactly:
        // LT = RT - (Z - center).
        constexpr int axisCenter = 32768;
        const int signedDifference = static_cast<int>(centeredZ) - axisCenter;
        const int rt = std::clamp(static_cast<int>(rightTriggerRaw), 0, 1023);
        const int lt = std::clamp(rt - signedDifference, 0, 1023);

        leftTrigger = NormalizeRawTrigger(lt);
        rightTrigger = NormalizeRawTrigger(rt);
    }

    void ParseAllyAxes(DeviceContext& device, const BYTE* report,
        ULONG reportLength, ControllerState& state)
    {
        (void)device;
        if (reportLength < 13)
            return;

        state.axisKnown[SDL_GAMEPAD_AXIS_LEFTX] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_LEFTY] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTX] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTY] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = true;

        state.axes[SDL_GAMEPAD_AXIS_LEFTX] =
            NormalizeRawStick16(ReadLittleEndian16(report, 1));
        state.axes[SDL_GAMEPAD_AXIS_LEFTY] =
            NormalizeRawStick16(ReadLittleEndian16(report, 3));
        state.axes[SDL_GAMEPAD_AXIS_RIGHTX] =
            NormalizeRawStick16(ReadLittleEndian16(report, 5));
        state.axes[SDL_GAMEPAD_AXIS_RIGHTY] =
            NormalizeRawStick16(ReadLittleEndian16(report, 7));

        ReconstructAllyTriggers(
            ReadLittleEndian16(report, 9),
            ReadLittleEndian16(report, 11),
            state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER],
            state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER]);
    }

'@

          $updated = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          Set-Content -Path $path -Value $updated -NoNewline

      - name: Commit source patch
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- WoWpadX/RawInputGamepad.cpp)) {
            Write-Host 'No source changes.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WoWpadX/RawInputGamepad.cpp
          git commit -m 'Reconstruct independent Ally trigger values'
          git push origin HEAD:agent/fix-dual-trigger-combo
