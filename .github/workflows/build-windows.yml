name: Build Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      SDL_VERSION: 3.4.10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply dual-trigger validation patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("WoWpadX/RawInputGamepad.cpp")
          text = path.read_text(encoding="utf-8-sig")
          text = text.replace("#include <atomic>\n", "#include <atomic>\n#include <chrono>\n", 1)

          anchor = "    ControllerState currentState;\n\n    // Owned exclusively by the Raw Input message thread.\n"
          replacement = """    ControllerState currentState;\n\n    struct TriggerCombinationState\n    {\n        bool centerCandidate = false;\n        bool bothHeld = false;\n        std::chrono::steady_clock::time_point centerSince{};\n    };\n\n    TriggerCombinationState triggerCombinationState;\n\n    // Owned exclusively by the Raw Input message thread.\n"""
          if "struct TriggerCombinationState" not in text:
              if anchor not in text:
                  raise SystemExit("controller state anchor not found")
              text = text.replace(anchor, replacement, 1)

          function = r'''    void ParseAllyAxes(
              const BYTE* report,
              ULONG reportLength,
              ControllerState& state)
          {
              if (reportLength < 11)
                  return;

              state.axisKnown[SDL_GAMEPAD_AXIS_LEFTX] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_LEFTY] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTX] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTY] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = true;

              state.axes[SDL_GAMEPAD_AXIS_LEFTX] = NormalizeStick(report[2]);
              state.axes[SDL_GAMEPAD_AXIS_LEFTY] = NormalizeStick(report[4]);
              state.axes[SDL_GAMEPAD_AXIS_RIGHTX] = NormalizeStick(report[6]);
              state.axes[SDL_GAMEPAD_AXIS_RIGHTY] = NormalizeStick(report[8]);

              constexpr int triggerCenter = 128;
              constexpr int bothCenterTolerance = 6;
              constexpr int bothReleaseTolerance = 12;
              constexpr auto bothHoldDelay = std::chrono::milliseconds(45);

              const int combinedTrigger = static_cast<int>(report[10]);
              const bool anyTriggerDigitallyPressed = (report[9] & 0x80) != 0;
              const int distanceFromCenter = std::abs(combinedTrigger - triggerCenter);
              const auto now = std::chrono::steady_clock::now();

              if (!anyTriggerDigitallyPressed) {
                  triggerCombinationState = {};
              }
              else if (distanceFromCenter <= bothCenterTolerance) {
                  if (!triggerCombinationState.centerCandidate) {
                      triggerCombinationState.centerCandidate = true;
                      triggerCombinationState.centerSince = now;
                  }
                  else if (now - triggerCombinationState.centerSince >= bothHoldDelay) {
                      triggerCombinationState.bothHeld = true;
                  }
              }
              else {
                  triggerCombinationState.centerCandidate = false;
                  if (triggerCombinationState.bothHeld &&
                      distanceFromCenter > bothReleaseTolerance) {
                      triggerCombinationState.bothHeld = false;
                  }
              }

              if (triggerCombinationState.bothHeld) {
                  state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = 32767;
                  state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = 32767;
                  return;
              }

              const int leftMagnitude = combinedTrigger < triggerCenter
                  ? triggerCenter - combinedTrigger
                  : 0;
              const int rightMagnitude = combinedTrigger > triggerCenter
                  ? combinedTrigger - triggerCenter
                  : 0;

              state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] =
                  NormalizeTriggerMagnitude(leftMagnitude, triggerCenter);
              state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] =
                  NormalizeTriggerMagnitude(rightMagnitude, 127);
          }

'''
          pattern = re.compile(r"    void ParseAllyAxes\(.*?\n    \}\n\n    bool LoadDevice", re.DOTALL)
          if not pattern.search(text):
              raise SystemExit("ParseAllyAxes not found")
          text = pattern.sub(function + "    bool LoadDevice", text, count=1)
          path.write_text(text, encoding="utf-8")

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          arch: win64_msvc2022_64
          cache: true

      - name: Install SDL
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SDL3-devel-$env:SDL_VERSION-VC.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "sdl"
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force

          $sdlRoot = Join-Path $extractRoot "SDL3-$env:SDL_VERSION"
          if (-not (Test-Path (Join-Path $sdlRoot "include\SDL3\SDL.h"))) {
            throw "SDL headers were not found at $sdlRoot"
          }

          "SDL3_ROOT=$sdlRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure WoWpadX
        shell: pwsh
        run: |
          cmake `
            -S (Join-Path $env:GITHUB_WORKSPACE "WoWpadX") `
            -B (Join-Path $env:GITHUB_WORKSPACE "build") `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DSDL3_ROOT=$env:SDL3_ROOT"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build WoWpadX
        shell: pwsh
        run: |
          cmake --build (Join-Path $env:GITHUB_WORKSPACE "build") --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "CMake build failed with exit code $LASTEXITCODE"
          }

      - name: Stage portable build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Filter WoWpadX.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "WoWpadX.exe was not produced"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path $exe.FullName -Destination (Join-Path $stage "WoWpadX.exe") -Force

          $sdlDll = Join-Path $env:SDL3_ROOT "lib\x64\SDL3.dll"
          Copy-Item -Path $sdlDll -Destination (Join-Path $stage "SDL3.dll") -Force

          $deployQt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $deployQt --release --qmldir (Join-Path $env:GITHUB_WORKSPACE "WoWpadX\QML") (Join-Path $stage "WoWpadX.exe")

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WoWpadX-xbox-dual-trigger-test-windows-x64
          path: artifact
          if-no-files-found: error
