name: Build Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      SDL_VERSION: 3.4.10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply trigger-report diagnostic patch
        shell: pwsh
        run: |
          $path = 'WoWpadX/RawInputGamepad.cpp'
          $text = Get-Content $path -Raw

          $parseStart = $text.IndexOf('    void ParseAllyAxes(')
          $parseEnd = $text.IndexOf('    bool LoadDevice(', $parseStart)
          if ($parseStart -lt 0 -or $parseEnd -lt 0) { throw 'Could not locate ParseAllyAxes.' }

          $parseReplacement = @'
    void ParseAllyAxes(
        const BYTE* report,
        ULONG reportLength,
        ControllerState& state)
    {
        if (reportLength < 11)
            return;

        state.axisKnown[SDL_GAMEPAD_AXIS_LEFTX] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_LEFTY] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTX] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTY] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = true;
        state.axisKnown[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = true;

        state.axes[SDL_GAMEPAD_AXIS_LEFTX] = NormalizeRawStick16(ReadLittleEndian16(report, 1));
        state.axes[SDL_GAMEPAD_AXIS_LEFTY] = NormalizeRawStick16(ReadLittleEndian16(report, 3));
        state.axes[SDL_GAMEPAD_AXIS_RIGHTX] = NormalizeRawStick16(ReadLittleEndian16(report, 5));
        state.axes[SDL_GAMEPAD_AXIS_RIGHTY] = NormalizeRawStick16(ReadLittleEndian16(report, 7));

        constexpr int triggerCenter = 128;
        const int combinedTrigger = static_cast<int>(report[10]);
        const int leftMagnitude = combinedTrigger < triggerCenter ? triggerCenter - combinedTrigger : 0;
        const int rightMagnitude = combinedTrigger > triggerCenter ? combinedTrigger - triggerCenter : 0;

        state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = static_cast<Sint16>(
            std::min(32767, leftMagnitude * 32767 / triggerCenter));
        state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = static_cast<Sint16>(
            std::min(32767, rightMagnitude * 32767 / 127));
    }

'@
          $text = $text.Substring(0, $parseStart) + $parseReplacement + $text.Substring($parseEnd)

          $processMarker = '    void ProcessRawInput(HRAWINPUT rawInputHandle)'
          $processIndex = $text.IndexOf($processMarker)
          if ($processIndex -lt 0) { throw 'Could not locate ProcessRawInput.' }

          $logger = @'
    void LogTriggerRelevantReportChanges(const BYTE* report, ULONG reportLength)
    {
        if (reportLength < 11)
            return;

        static std::array<BYTE, 16> previous{};
        static ULONG previousLength = 0;
        static bool initialized = false;
        const ULONG capturedLength = std::min<ULONG>(reportLength, static_cast<ULONG>(previous.size()));
        bool changed = !initialized || previousLength != capturedLength;

        if (!changed) {
            for (ULONG index = 9; index < capturedLength; ++index) {
                if (previous[index] != report[index]) {
                    changed = true;
                    break;
                }
            }
        }
        if (!changed)
            return;

        QStringList bytes;
        for (ULONG index = 0; index < capturedLength; ++index) {
            bytes.append(QString("%1").arg(report[index], 2, 16, QLatin1Char('0')));
            previous[index] = report[index];
        }
        previousLength = capturedLength;
        initialized = true;

        Log::writeLine(QString("[RawInputTriggerProbe] bytes=[%1] trigger16=%2 triggerHi=%3 tail=[%4]")
            .arg(bytes.join(' '))
            .arg(ReadLittleEndian16(report, 9))
            .arg(report[10])
            .arg(bytes.mid(11).join(' ')));
    }

'@
          $text = $text.Insert($processIndex, $logger)

          $needle = '            ControllerState state;'
          $callIndex = $text.IndexOf($needle, $text.IndexOf($processMarker))
          if ($callIndex -lt 0) { throw 'Could not locate parsing loop.' }
          $text = $text.Insert($callIndex, "            LogTriggerRelevantReportChanges(report, reportLength);`r`n`r`n")
          Set-Content -Path $path -Value $text -NoNewline

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          arch: win64_msvc2022_64
          cache: true

      - name: Install SDL
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SDL3-devel-$env:SDL_VERSION-VC.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "sdl"
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
          $sdlRoot = Join-Path $extractRoot "SDL3-$env:SDL_VERSION"
          if (-not (Test-Path (Join-Path $sdlRoot "include\SDL3\SDL.h"))) { throw "SDL headers were not found at $sdlRoot" }
          "SDL3_ROOT=$sdlRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure WoWpadX
        shell: pwsh
        run: |
          cmake -S (Join-Path $env:GITHUB_WORKSPACE "WoWpadX") -B (Join-Path $env:GITHUB_WORKSPACE "build") -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DSDL3_ROOT=$env:SDL3_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed with exit code $LASTEXITCODE" }

      - name: Build WoWpadX
        shell: pwsh
        run: |
          cmake --build (Join-Path $env:GITHUB_WORKSPACE "build") --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }

      - name: Stage portable build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Filter WoWpadX.exe | Select-Object -First 1
          if (-not $exe) { throw "WoWpadX.exe was not produced" }
          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path $exe.FullName -Destination (Join-Path $stage "WoWpadX.exe") -Force
          Copy-Item -Path (Join-Path $env:SDL3_ROOT "lib\x64\SDL3.dll") -Destination (Join-Path $stage "SDL3.dll") -Force
          & (Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe") --release --qmldir (Join-Path $env:GITHUB_WORKSPACE "WoWpadX\QML") (Join-Path $stage "WoWpadX.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WoWpadX-xbox-windows-x64
          path: artifact
          if-no-files-found: error
