name: Build Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SDL_VERSION: 3.4.10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Ally trigger and modifier fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          source_path = Path("WoWpadX/RawInputDiagnostics.cpp")
          source = source_path.read_text(encoding="utf-8-sig")

          if "firstDirectTriggerMotionLogged" not in source:
              source, count = re.subn(
                  r"(?m)^(\s*)bool firstDirectStickMotionLogged = false;\s*$",
                  lambda match: (
                      f"{match.group(1)}bool firstDirectStickMotionLogged = false;\n"
                      f"{match.group(1)}bool firstDirectTriggerMotionLogged = false;"
                  ),
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate Ally trigger log field insertion point")

          source = re.sub(
              r"reportLength\s*<\s*10",
              "reportLength < 11",
              source,
              count=1,
          )

          if "First direct Ally trigger state" not in source:
              pattern = re.compile(
                  r"(?m)^(?P<indent>\s*)parsed\.axes\[SDL_GAMEPAD_AXIS_RIGHTY\]\s*=\s*"
                  r"NormalizeAllyStickByte\(report\[8\]\);\s*$"
              )

              trigger_code = r'''

{indent}// The Ally compatibility HID collection exposes both analog triggers
{indent}// on one centered byte. Left drives 0x80 toward 0x00 and right drives
{indent}// 0x80 toward 0xFF. Convert each half into SDL's 0..32767 range.
{indent}parsed.axisKnown[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = true;
{indent}parsed.axisKnown[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = true;

{indent}const int combinedTrigger = static_cast<int>(report[10]);
{indent}const int leftMagnitude = combinedTrigger < 128
{indent}    ? 128 - combinedTrigger
{indent}    : 0;
{indent}const int rightMagnitude = combinedTrigger > 128
{indent}    ? combinedTrigger - 128
{indent}    : 0;

{indent}parsed.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = static_cast<Sint16>(
{indent}    std::min(32767, leftMagnitude * 32767 / 128));
{indent}parsed.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = static_cast<Sint16>(
{indent}    std::min(32767, rightMagnitude * 32767 / 127));

{indent}if (combinedTrigger != 128 && !device.firstDirectTriggerMotionLogged) {{
{indent}    device.firstDirectTriggerMotionLogged = true;
{indent}    Log::writeLine(
{indent}        QString(
{indent}            "[RawInput] First direct Ally trigger state: raw=%1 LT=%2 RT=%3")
{indent}            .arg(combinedTrigger)
{indent}            .arg(parsed.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER])
{indent}            .arg(parsed.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER]));
{indent}}}
'''

              def add_triggers(match):
                  indent = match.group("indent")
                  return match.group(0) + trigger_code.format(indent=indent)

              source, count = pattern.subn(add_triggers, source, count=1)
              if count != 1:
                  raise SystemExit("Could not locate Ally stick assignment insertion point")

          source_path.write_text(source, encoding="utf-8")

          qml_path = Path("WoWpadX/QML/SettingsKeybindings.qml")
          qml = qml_path.read_text(encoding="utf-8-sig")
          if "A selected preset overrides stale hidden custom bindings" not in qml:
              qml, count = re.subn(
                  r"(?m)^(\s*)onCurrentIndexChanged:\s*AppSettings\.modifierStyle\s*=\s*currentIndex\s*$",
                  lambda match: (
                      f"{match.group(1)}onActivated: {{\n"
                      f"{match.group(1)}    // A selected preset overrides stale hidden custom bindings.\n"
                      f"{match.group(1)}    AppSettings.customBindings = false\n"
                      f"{match.group(1)}    AppSettings.modifierStyle = currentIndex\n"
                      f"{match.group(1)}    AppSettings.save()\n"
                      f"{match.group(1)}}}"
                  ),
                  qml,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate modifier preset handler")
          qml_path.write_text(qml, encoding="utf-8")

      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WoWpadX/RawInputDiagnostics.cpp WoWpadX/QML/SettingsKeybindings.qml
          git commit -m "[ally-trigger-fix] Decode combined triggers and apply modifier presets"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.1
          arch: win64_msvc2022_64
          cache: true

      - name: Install SDL
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SDL3-devel-$env:SDL_VERSION-VC.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "sdl"
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force

          $sdlRoot = Join-Path $extractRoot "SDL3-$env:SDL_VERSION"
          if (-not (Test-Path (Join-Path $sdlRoot "include\SDL3\SDL.h"))) {
            throw "SDL headers were not found at $sdlRoot"
          }

          "SDL3_ROOT=$sdlRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure WoWpadX
        shell: pwsh
        run: |
          cmake `
            -S (Join-Path $env:GITHUB_WORKSPACE "WoWpadX") `
            -B (Join-Path $env:GITHUB_WORKSPACE "build") `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DSDL3_ROOT=$env:SDL3_ROOT"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build WoWpadX
        shell: pwsh
        run: |
          cmake --build (Join-Path $env:GITHUB_WORKSPACE "build") --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "CMake build failed with exit code $LASTEXITCODE"
          }

      - name: Stage portable build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Filter WoWpadX.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "WoWpadX.exe was not produced"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path $exe.FullName -Destination (Join-Path $stage "WoWpadX.exe") -Force

          $sdlDll = Join-Path $env:SDL3_ROOT "lib\x64\SDL3.dll"
          Copy-Item -Path $sdlDll -Destination (Join-Path $stage "SDL3.dll") -Force

          $deployQt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $deployQt --release --qmldir (Join-Path $env:GITHUB_WORKSPACE "WoWpadX\QML") (Join-Path $stage "WoWpadX.exe")

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WoWpadX-xbox-windows-x64
          path: artifact
          if-no-files-found: error
