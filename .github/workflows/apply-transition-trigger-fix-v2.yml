name: Apply transition trigger fix v2

on:
  push:
    branches:
      - agent/fix-dual-trigger-combo

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dual-trigger-combo

      - name: Apply committed source fix
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          path = Path("WoWpadX/RawInputGamepad.cpp")
          text = path.read_text(encoding="utf-8-sig")

          if "bool digitalActive = false;" in text:
              print("Transition decoder already applied")
              raise SystemExit(0)

          state_b64 = ""
          func_b64 = ""

          state = base64.b64decode(state_b64).decode("utf-8")
          function = base64.b64decode(func_b64).decode("utf-8")

          state_pattern = re.compile(
              r"    struct TriggerCombinationState\n    \{.*?\n    \};\n\n    std::atomic<bool> started",
              re.DOTALL,
          )
          if not state_pattern.search(text):
              raise SystemExit("TriggerCombinationState not found")
          text = state_pattern.sub(state + "\n\n    std::atomic<bool> started", text, count=1)

          function_pattern = re.compile(
              r"    void ParseAllyAxes\(.*?\n    \}\n\n    bool LoadDevice",
              re.DOTALL,
          )
          if not function_pattern.search(text):
              raise SystemExit("ParseAllyAxes not found")
          text = function_pattern.sub(function + "    bool LoadDevice", text, count=1)
          path.write_text(text, encoding="utf-8")

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- WoWpadX/RawInputGamepad.cpp; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WoWpadX/RawInputGamepad.cpp
          git commit -m "Use trigger side transitions for LT+RT chord"
          git push origin HEAD:agent/fix-dual-trigger-combo
