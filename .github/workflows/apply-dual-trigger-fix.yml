name: Apply dual-trigger combo fix

on:
  push:
    branches:
      - agent/fix-dual-trigger-combo

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dual-trigger-combo

      - name: Apply stateful Ally dual-trigger decoder
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("WoWpadX/RawInputGamepad.cpp")
          text = path.read_text(encoding="utf-8-sig")

          if "#include <chrono>" not in text:
              text = text.replace(
                  "#include <atomic>\n",
                  "#include <atomic>\n#include <chrono>\n",
                  1,
              )

          state_anchor = """    ControllerState currentState;\n\n    // Owned exclusively by the Raw Input message thread.\n"""
          state_replacement = """    ControllerState currentState;\n\n    struct TriggerCombinationState\n    {\n        bool centerCandidate = false;\n        bool bothHeld = false;\n        std::chrono::steady_clock::time_point centerSince{};\n    };\n\n    TriggerCombinationState triggerCombinationState;\n\n    // Owned exclusively by the Raw Input message thread.\n"""
          if "struct TriggerCombinationState" not in text:
              if state_anchor not in text:
                  raise SystemExit("Could not locate controller-state anchor")
              text = text.replace(state_anchor, state_replacement, 1)

          new_function = r'''    void ParseAllyAxes(
              const BYTE* report,
              ULONG reportLength,
              ControllerState& state)
          {
              if (reportLength < 11)
                  return;

              state.axisKnown[SDL_GAMEPAD_AXIS_LEFTX] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_LEFTY] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTX] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_RIGHTY] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = true;
              state.axisKnown[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = true;

              state.axes[SDL_GAMEPAD_AXIS_LEFTX] = NormalizeStick(report[2]);
              state.axes[SDL_GAMEPAD_AXIS_LEFTY] = NormalizeStick(report[4]);
              state.axes[SDL_GAMEPAD_AXIS_RIGHTX] = NormalizeStick(report[6]);
              state.axes[SDL_GAMEPAD_AXIS_RIGHTY] = NormalizeStick(report[8]);

              // The Ally compatibility report combines both analog triggers on
              // byte 10. Byte 9 bit 7 remains set while at least one trigger is
              // physically past its click threshold. When both triggers are held
              // with similar pressure, byte 10 returns to its neutral value (128)
              // even though byte 9 remains set.
              //
              // A single trigger release also passes through neutral briefly, so
              // require the neutral-plus-digital condition to remain stable before
              // exposing both trigger axes. The next face-button report gives this
              // detector another sample even when the trigger values stop changing.
              constexpr int triggerCenter = 128;
              constexpr int bothCenterTolerance = 6;
              constexpr int bothReleaseTolerance = 12;
              constexpr auto bothHoldDelay = std::chrono::milliseconds(45);

              const int combinedTrigger = static_cast<int>(report[10]);
              const bool anyTriggerDigitallyPressed = (report[9] & 0x80) != 0;
              const int distanceFromCenter =
                  std::abs(combinedTrigger - triggerCenter);
              const auto now = std::chrono::steady_clock::now();

              if (!anyTriggerDigitallyPressed) {
                  triggerCombinationState = {};
              }
              else if (distanceFromCenter <= bothCenterTolerance) {
                  if (!triggerCombinationState.centerCandidate) {
                      triggerCombinationState.centerCandidate = true;
                      triggerCombinationState.centerSince = now;
                  }
                  else if (now - triggerCombinationState.centerSince >=
                           bothHoldDelay) {
                      triggerCombinationState.bothHeld = true;
                  }
              }
              else {
                  triggerCombinationState.centerCandidate = false;
                  if (triggerCombinationState.bothHeld &&
                      distanceFromCenter > bothReleaseTolerance) {
                      triggerCombinationState.bothHeld = false;
                  }
              }

              if (triggerCombinationState.bothHeld) {
                  state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] = 32767;
                  state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] = 32767;
                  return;
              }

              const int leftMagnitude = combinedTrigger < triggerCenter
                  ? triggerCenter - combinedTrigger
                  : 0;
              const int rightMagnitude = combinedTrigger > triggerCenter
                  ? combinedTrigger - triggerCenter
                  : 0;

              state.axes[SDL_GAMEPAD_AXIS_LEFT_TRIGGER] =
                  NormalizeTriggerMagnitude(leftMagnitude, triggerCenter);
              state.axes[SDL_GAMEPAD_AXIS_RIGHT_TRIGGER] =
                  NormalizeTriggerMagnitude(rightMagnitude, 127);
          }

'''

          pattern = re.compile(
              r"    void ParseAllyAxes\(.*?\n    \}\n\n    bool LoadDevice",
              re.DOTALL,
          )
          if not pattern.search(text):
              raise SystemExit("Could not locate ParseAllyAxes")
          text = pattern.sub(new_function + "    bool LoadDevice", text, count=1)
          path.write_text(text, encoding="utf-8")

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dual-trigger-fix.yml
          git add WoWpadX/RawInputGamepad.cpp
          git commit -m "Support simultaneous Ally trigger modifiers"
          git push origin HEAD:agent/fix-dual-trigger-combo
